name: Apply demo first, grass and routing fix

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # 1. Move interactive demo immediately below the hero.
          start=s.index('<section id="experiment">')
          end=s.index('</section>', start)+len('</section>')
          exp=s[start:end]
          s=s[:start]+s[end:]
          pos=s.index('<main>')+len('<main>')
          s=s[:pos]+'\n'+exp+'\n'+s[pos:]

          s=s.replace('ljusare gräs = klippt','kortare + ljusare gräs = klippt')
          s=s.replace('faktisk täckning på ett raster','faktisk täckning på ett raster och ett separat 3D-lager av stående grässtrån som kortas när klippdisken passerar')

          # 2. Never simplify a connector by blindly skipping grid nodes.
          old="""  if(end<0)return[goal];const rev=[];for(let k=end;k>=0;k=prev[k]){const[x,y]=coord(k);rev.push([b.minX+x*step,b.minY+y*step]);if(prev[k]===-1)break}rev.reverse();rev.push(goal);return rev.filter((_,i)=>i===rev.length-1||i%2===0)\n}"""
          new="""  if(end<0)return[goal];\n  const rev=[];\n  for(let k=end;k>=0;k=prev[k]){\n    const[x,y]=coord(k);\n    rev.push([b.minX+x*step,b.minY+y*step]);\n    if(prev[k]===-1)break;\n  }\n  rev.reverse();\n  rev.push(goal);\n\n  // Only skip waypoints when the complete straight segment stays inside\n  // the lawn. The previous every-other-node shortcut could cut across\n  // grey ground in narrow H-shaped passages.\n  const safe=[];\n  let i=0;\n  while(i<rev.length){\n    safe.push(rev[i]);\n    if(i===rev.length-1)break;\n    let j=rev.length-1;\n    while(j>i+1 && !straightInside(rev[i],rev[j],poly,.40))j--;\n    i=j;\n  }\n  return safe;\n}"""
          if old not in s: raise SystemExit('bfs patch target missing')
          s=s.replace(old,new)

          # 3. Instanced 3D grass. Each blade is indexed spatially so only\n          # blades under the cutter are updated.
          grass=r'''\nfunction makeGrassField(poly,offset){\n  const A=areaPoly(poly),count=Math.min(4200,Math.max(1400,Math.floor(A*31)));\n  const geom=new THREE.PlaneGeometry(.040,.36);geom.translate(0,.18,0);\n  const material=new THREE.MeshStandardMaterial({color:0x3f9148,side:THREE.DoubleSide,roughness:1,metalness:0,vertexColors:true});\n  const mesh=new THREE.InstancedMesh(geom,material,count);\n  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);mesh.castShadow=false;mesh.receiveShadow=true;\n  const data=[],buckets=new Map(),cell=.48,dummy=new THREE.Object3D();\n  const freshA=new THREE.Color(0x367f3e),freshB=new THREE.Color(0x58a34f);\n  const key=(gx,gy)=>gx+','+gy;\n  for(let i=0;i<count;i++){\n    let p=randomPoint(poly,.03),x=p[0],y=p[1];\n    const angle=Math.random()*Math.PI,h=.23+Math.random()*.20,sx=.72+Math.random()*.65;\n    const lean=(Math.random()-.5)*.17;\n    data.push({x,y,angle,h,sx,lean,cut:false});\n    dummy.position.set(offset+x,.012,y);dummy.rotation.set(lean,angle,(Math.random()-.5)*.08);dummy.scale.set(sx,h/.36,1);dummy.updateMatrix();\n    mesh.setMatrixAt(i,dummy.matrix);\n    mesh.setColorAt(i,freshA.clone().lerp(freshB,Math.random()));\n    const gx=Math.floor(x/cell),gy=Math.floor(y/cell),k=key(gx,gy);if(!buckets.has(k))buckets.set(k,[]);buckets.get(k).push(i);\n  }\n  mesh.instanceMatrix.needsUpdate=true;if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;addSim(mesh);\n  return{mesh,data,buckets,cell,offset,dummy,key};\n}\n\nfunction cutGrassField(field,x,y,r){\n  if(!field)return;\n  const {mesh,data,buckets,cell,offset,dummy,key}=field,r2=r*r;\n  const gx0=Math.floor((x-r)/cell),gx1=Math.floor((x+r)/cell),gy0=Math.floor((y-r)/cell),gy1=Math.floor((y+r)/cell);\n  let changed=false;\n  const cutA=new THREE.Color(0x63a954),cutB=new THREE.Color(0x82ba68);\n  for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){\n    const ids=buckets.get(key(gx,gy));if(!ids)continue;\n    for(const i of ids){const d=data[i];if(d.cut)continue;const dx=d.x-x,dy=d.y-y;if(dx*dx+dy*dy>r2)continue;\n      d.cut=true;const h=.075+Math.random()*.035;\n      dummy.position.set(offset+d.x,.012,d.y);dummy.rotation.set(d.lean*.25,d.angle,0);dummy.scale.set(d.sx*.95,h/.36,1);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);\n      mesh.setColorAt(i,cutA.clone().lerp(cutB,Math.random()));changed=true;\n    }\n  }\n  if(changed){mesh.instanceMatrix.needsUpdate=true;if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true}\n}\n'''
          marker='function createWorld(poly,offset,kind){'
          if marker not in s: raise SystemExit('createWorld marker missing')
          s=s.replace(marker,grass+'\n'+marker,1)

          old="""  // subtle curb/border line\n  const pts=poly.map(([x,y])=>new THREE.Vector3(offset+x,.03,y));pts.push(pts[0].clone());\n  const border=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x91a196,transparent:true,opacity:.55}));addSim(border);\n\n  const dp=dockPoint(poly),dock=makeDock();"""
          new="""  // subtle curb/border line\n  const pts=poly.map(([x,y])=>new THREE.Vector3(offset+x,.03,y));pts.push(pts[0].clone());\n  const border=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x91a196,transparent:true,opacity:.55}));addSim(border);\n\n  const grass=makeGrassField(poly,offset);\n\n  const dp=dockPoint(poly),dock=makeDock();"""
          if old not in s: raise SystemExit('grass insertion target missing')
          s=s.replace(old,new,1)

          old="const w={poly,offset,kind,lawn,mower,dockPos:dp"
          new="const w={poly,offset,kind,lawn,grass,mower,dockPos:dp"
          if old not in s: raise SystemExit('world grass target missing')
          s=s.replace(old,new,1)

          old="function markCut(w,dt,active=true){if(active){w.covered+=w.lawn.mark(w.x,w.y,cutWidth/2);w.texTick+=dt;if(w.texTick>.15){w.lawn.draw();w.texTick=0}}}"
          new="function markCut(w,dt,active=true){if(active){w.covered+=w.lawn.mark(w.x,w.y,cutWidth/2);cutGrassField(w.grass,w.x,w.y,cutWidth/2);w.texTick+=dt;if(w.texTick>.15){w.lawn.draw();w.texTick=0}}}"
          if old not in s: raise SystemExit('markCut target missing')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY

          # Syntax-check the module JS before committing.
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          Path('/tmp/check.mjs').write_text(m.group(1))
          PY
          node --check /tmp/check.mjs

      - name: Commit patch and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-demo-grass-fix.yml
          git commit -m "feat: put demo first, add cuttable 3D grass and safe routing"
          git push
